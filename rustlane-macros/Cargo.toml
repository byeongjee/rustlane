[package]
name = "rustlane-macros"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Proc macros for rustlane: the #[kernel]/#[export] attributes and foreach! that lower ISPC-style SPMD control flow to masked SIMD"
keywords = ["simd", "spmd", "ispc", "parallel", "vectorization"]
categories = ["hardware-support", "concurrency"]
repository = "https://github.com/byeongjee/rustlane"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit-mut", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# `trybuild` drives the compile-fail UI suite (tests/ui.rs, tests/ui-export.rs).
# The `rustlane` dev-dependency closes a cycle (rustlane -> rustlane-macros as a normal
# dep); cargo permits it because the back-edge is a DEV dependency, used only
# when building rustlane-macros' own tests. The UI kernels need the real runtime
# (`::rustlane::…` paths the macro emits, plus the `on_unimplemented` traits) in
# scope to exercise the type-level rejections.
[dev-dependencies]
trybuild = "1"
rustlane = { path = "../rustlane" }
